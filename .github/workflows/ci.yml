name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Production build
        run: npm run build
      # The player and story modes only render in draft mode until stories
      # are publishable, so e2e tests run against a draft build.
      - name: Draft build for e2e
        run: npm run build
        env:
          NEXT_PUBLIC_SHOW_DRAFTS: "true"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SHOW_DRAFTS: "true"
